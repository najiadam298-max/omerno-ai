<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Omerno AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0f172a;
  color: #fff;
  min-height: 100vh;
}

/* LOGIN */

.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 400px;
  background: #1e293b;
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,.4);
}

.login-card h1 {
  text-align: center;
  margin-bottom: 8px;
}

.login-card p {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #475569;
  border-radius: 8px;
  background: #0f172a;
  color: white;
  outline: none;
}

input:focus {
  border-color: #3b82f6;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.login-button {
  width: 100%;
  margin-top: 20px;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}

.error {
  background: #7f1d1d;
  color: #fecaca;
}

.success {
  background: #14532d;
  color: #bbf7d0;
}

/* DASHBOARD */

.dashboard {
  display: none;
  min-height: 100vh;
}

header {
  height: 70px;
  padding: 0 30px;
  background: #1e293b;
  border-bottom: 1px solid #334155;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h2 {
  color: #60a5fa;
}

.logout {
  background: #dc2626;
}

main {
  width: 92%;
  max-width: 1100px;
  margin: 30px auto;
}

.stats {
  display: flex;
  gap: 20px;
  margin-bottom: 25px;
}

.stat {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  min-width: 190px;
}

.stat span {
  color: #94a3b8;
}

.stat strong {
  display: block;
  margin-top: 8px;
  font-size: 28px;
  color: #60a5fa;
}

.table-box {
  background: #1e293b;
  border-radius: 12px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 15px;
  text-align: left;
  border-bottom: 1px solid #334155;
}

th {
  color: #94a3b8;
  font-size: 13px;
}

.hash {
  font-family: monospace;
  color: #60a5fa;
  font-size: 12px;
  word-break: break-all;
}

.empty {
  text-align: center;
  color: #94a3b8;
  padding: 30px;
}

@media(max-width:600px) {
  header {
    padding: 0 15px;
  }

  main {
    width: 94%;
  }

  .stats {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section class="login-page" id="loginPage">

  <div class="login-card">

    <h1>Login to Omerno AI</h1>

    <p>
      Omerno AI
    </p>

    <form id="loginForm">

      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="text@example.com"
        required
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="password"
        required
      >

      <button
        class="login-button"
        type="submit"
      >
        Login
      </button>

      <div
        id="error"
        class="message error"
      >
        Invalid login
      </div>

      <div
        id="success"
        class="message success"
      >
        login successful
      </div>

    </form>

  </div>

</section>


<!-- ================= ADMIN DASHBOARD ================= -->

<section
  class="dashboard"
  id="dashboard"
>

  <header>

    <h2>Admin Dashboard</h2>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </header>


  <main>

    <div class="stats">

      <div class="stat">

        <span>
          Logins
        </span>

        <strong id="total">
          0
        </strong>

      </div>

    </div>


    <div class="table-box">

      <table>

        <thead>

          <tr>
            <th>#</th>
            <th>Email</th>
            <th>Password</th>
          </tr>

        </thead>

        <tbody id="records"></tbody>

      </table>

    </div>

  </main>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://supabase.com/dashboard/project/ksynptgueutmqzleppar";
const SUPABASE_KEY = "sb_publishable_2sd96SqgaGWNusnlsQ0FMw_Svuu9JlT";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginForm = document.getElementById("loginForm");
const loginPage = document.getElementById("loginPage");
const dashboard = document.getElementById("dashboard");
const errorBox = document.getElementById("error");
const successBox = document.getElementById("success");
const records = document.getElementById("records");
const total = document.getElementById("total");

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  errorBox.style.display = "none";
  successBox.style.display = "none";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    errorBox.textContent = "Invalid email or password";
    errorBox.style.display = "block";
    return;
  }

  await supabaseClient
    .from("login_records")
    .insert({
      email: data.user.email
    });

  successBox.style.display = "block";

  setTimeout(() => {
    loginPage.style.display = "none";
    dashboard.style.display = "block";
    loadRecords();
  }, 400);
});

async function loadRecords() {
  const { data, error } =
    await supabaseClient
      .from("login_records")
      .select("id, email, created_at")
      .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  records.innerHTML = "";
  total.textContent = data.length;

  data.forEach((item, index) => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${index + 1}</td>
      <td>${item.email}</td>
      <td>${new password(item.password).toLocaleString()}</td>
    `;

    records.appendChild(row);
  });
}

async function logout() {
  await supabaseClient.auth.signOut();

  dashboard.style.display = "none";
  loginPage.style.display = "flex";

  loginForm.reset();
  successBox.style.display = "none";
  errorBox.style.display = "none";
}

loadRecords();
</script>





</body>
</html>
